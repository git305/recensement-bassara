<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bassara — Nouveau mot de passe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f3f6fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#101828}
.box{width:min(430px,100%);background:#fff;border:1px solid #d8e0e8;border-radius:20px;padding:30px;box-shadow:0 15px 40px #12365f18}
.logo{width:58px;height:58px;border-radius:15px;background:#12365f;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900}
h1{color:#12365f}label{display:block;font-size:13px;font-weight:800;margin:15px 0 6px}input{width:100%;padding:13px;border:1px solid #98a2b3;border-radius:10px;font-size:16px}
button{width:100%;border:0;border-radius:10px;padding:13px;margin-top:18px;background:#4f8f2f;color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.msg{margin-top:15px;padding:13px;border-radius:10px;background:#eef7e9;color:#3f6e2d}.error{background:#fff1f1;color:#b42318}
</style>
</head>
<body>
<div class="box">
<div class="logo">B</div>
<h1>Nouveau mot de passe</h1>
<p>Choisissez un nouveau mot de passe pour votre compte administrateur.</p>
<form id="form">
<label>Nouveau mot de passe</label>
<input id="password" type="password" minlength="8" autocomplete="new-password" required>
<label>Confirmer le mot de passe</label>
<input id="confirm" type="password" minlength="8" autocomplete="new-password" required>
<button id="btn" type="submit">🔐 Enregistrer le nouveau mot de passe</button>
</form>
<div id="message"></div>
</div>
<script>
const SUPABASE_URL="https://gxsokrwqefletxitejde.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_4z1GPpx-LMGbKNXXPoHT3A_zD0Q60XC";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

document.getElementById("form").addEventListener("submit",async e=>{
 e.preventDefault();
 const password=document.getElementById("password").value;
 const confirm=document.getElementById("confirm").value;
 const message=document.getElementById("message");
 const btn=document.getElementById("btn");
 message.innerHTML="";
 if(password!==confirm){
  message.innerHTML='<div class="msg error">❌ Les deux mots de passe ne correspondent pas.</div>';
  return;
 }
 if(password.length<8){
  message.innerHTML='<div class="msg error">❌ Le mot de passe doit contenir au moins 8 caractères.</div>';
  return;
 }
 btn.disabled=true;btn.textContent="⏳ Enregistrement...";
 const {error}=await db.auth.updateUser({password});
 if(error){
  message.innerHTML='<div class="msg error">❌ '+escapeHtml(error.message)+'</div>';
  btn.disabled=false;btn.textContent="🔐 Enregistrer le nouveau mot de passe";
  return;
 }
 message.innerHTML='<div class="msg">✅ Mot de passe modifié avec succès.<br><br><a href="admin_bassara.html">➡️ Ouvrir l'administration</a></div>';
 btn.disabled=false;
});
function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
</script>
</body>
</html>
